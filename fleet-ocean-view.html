<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fleet at Anchor — bird's-eye</title>
<style>
  :root{
    --void:#04060e; --term:#57b6ff; --termlite:#9adcff; --gold:#e6b450;
    --goldlite:#f5d76e; --rust:#e0575f; --green:#5fcf80; --dim:#8b95ad; --faint:#57607a;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  body{margin:0;background:var(--void);color:#e4e8f4;font-family:var(--mono);padding:24px}
  .frame{max-width:1000px;margin:0 auto}
  .cap{text-align:center;font:11px/1.6 var(--mono);letter-spacing:.14em;color:var(--faint);margin-top:14px;text-transform:uppercase}
  h2{text-align:center;font-family:'Trebuchet MS',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#fff;font-size:20px}
  .sub{text-align:center;color:var(--dim);font-style:italic;font-size:13px;margin-bottom:16px}
  canvas{display:block;width:100%;height:auto;border:1px solid #1a2440;border-radius:12px;
    background:radial-gradient(1200px 600px at 50% 35%, #14263f 0%, #0a1424 60%, #060c16 100%)}
  .legend{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--dim)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:2px;display:inline-block}
</style>
</head>
<body>
<div class="frame">
  <h2>The Fleet at Anchor</h2>
  <div class="sub">Bird's-eye · the fleet in formation, the Sentry Corps ringing the harbor</div>
  <canvas id="sea" width="1200" height="820"></canvas>
  <div class="legend">
    <span><i class="dot" style="background:#f5d76e"></i> Ships of the Line (on-repo)</span>
    <span><i class="dot" style="background:#e6b450;opacity:.6"></i> Fleet Beyond the Harbor (off-repo)</span>
    <span><i class="dot" style="background:#57b6ff"></i> Sentry Corps (the watch)</span>
  </div>
  <div class="cap">Amenti Command · a living chart</div>
</div>

<script>
(function(){
  const c = document.getElementById('sea'), x = c.getContext('2d');
  if(!x.roundRect){ x.roundRect=function(x0,y0,w,hh,r){this.beginPath();this.moveTo(x0+r,y0);this.arcTo(x0+w,y0,x0+w,y0+hh,r);this.arcTo(x0+w,y0+hh,x0,y0+hh,r);this.arcTo(x0,y0+hh,x0,y0,r);this.arcTo(x0,y0,x0+w,y0,r);this.closePath();return this;}; }
  const W = c.width, H = c.height;

  // ---- the fleet, from the manifest ----
  // on-repo ships (gold), in formation near center
  const ships = [
    {n:'Page1 · Codex',   cls:'flag', gx:0,  gy:-1.2, size:1.4},
    {n:'Court',           cls:'ship', gx:-1.6,gy:0,   size:1},
    {n:'Weighing',        cls:'ship', gx:-2.7,gy:0.9, size:.9},
    {n:'docket',          cls:'ship', gx:-1.1,gy:1.4, size:.9},
    {n:'Page2',           cls:'ship', gx:1.6, gy:0,   size:1},
    {n:'Page3',           cls:'ship', gx:2.7, gy:0.9, size:.9},
    {n:'game01',          cls:'ship', gx:1.1, gy:1.4, size:.9},
  ];
  // off-repo cloud vessels (dim gold, dashed, further out)
  const offshore = [
    {n:'Mint',     gx:-3.4, gy:-2.2},
    {n:'Proxy',    gx:0,    gy:-3.2},
    {n:'Supabase', gx:3.4,  gy:-2.2},
    {n:'CF Email', gx:0,    gy:3.4},
  ];
  // sentries (blue), ringing the fleet — watchtower buoys
  const sentries = [
    {n:'TREASURY WATCH', corner:'tl'},   // top-left
    {n:'COST WATCH',     corner:'tr'},   // top-right
    {n:'DATA WATCH',     corner:'br'},   // bottom-right
    {n:'HULL WATCH',     corner:'bl'},   // bottom-left
  ];

  const CX = W/2, CY = H/2 + 20, U = 96; // unit spacing (enlarged)
  let t = 0;

  function ship(px,py,size,ang,col,glow,flag){ size = size*1.4; // enlarge ships
    x.save(); x.translate(px,py); x.rotate(ang);
    // wake
    x.globalAlpha=.28; x.strokeStyle=col; x.lineWidth=1.2;
    x.beginPath(); x.moveTo(-14*size,6*size); x.quadraticCurveTo(-30*size,0,-14*size,-6*size); x.stroke();
    x.globalAlpha=1;
    // hull (top-down pointed oval)
    x.beginPath();
    x.moveTo(16*size,0);
    x.quadraticCurveTo(6*size,7*size,-12*size,5*size);
    x.lineTo(-12*size,-5*size);
    x.quadraticCurveTo(6*size,-7*size,16*size,0);
    x.closePath();
    const g=x.createLinearGradient(-12*size,0,16*size,0);
    g.addColorStop(0,'#a8842f'); g.addColorStop(1,col);
    x.fillStyle=g; x.shadowColor=glow; x.shadowBlur=flag?26:16; x.fill();
    x.shadowBlur=0;
    // deck line
    x.strokeStyle='rgba(0,0,0,.4)'; x.lineWidth=1; x.stroke();
    // mast dot
    x.fillStyle= flag ? '#fff' : '#ffe6a0';
    x.beginPath(); x.arc(0,0,flag?3:2,0,7); x.fill();
    x.restore();
  }

  function draw(){
    t += 0.016;
    x.clearRect(0,0,W,H);

    // ---- ocean swell (moving concentric shimmer) ----
    for(let i=8;i>=1;i--){
      const r = i*46 + Math.sin(t*0.6+i)*4;
      x.beginPath(); x.arc(CX,CY,r,0,7);
      x.strokeStyle='rgba(120,180,240,'+(0.10+0.05*Math.sin(t+i))+')';
      x.lineWidth=1.4; x.stroke();
    }
    // wave streaks
    for(let i=0;i<26;i++){
      const yy = (i*26 + (t*14)%26);
      x.beginPath(); x.moveTo(0,yy); 
      for(let xx=0;xx<=W;xx+=40){ x.lineTo(xx, yy+Math.sin((xx*0.02)+t+i)*2); }
      x.strokeStyle='rgba(130,175,230,0.07)'; x.lineWidth=1; x.stroke();
    }

    // ---- sentry ring (the watch) ----
    const ringR = 330;
    x.beginPath(); x.arc(CX,CY,ringR,0,7);
    x.setLineDash([4,8]); x.strokeStyle='rgba(120,190,255,.45)'; x.lineWidth=1.6; x.stroke();
    x.setLineDash([]);
    sentries.forEach(s=>{
      const M = 46;   // margin from the screen edge
      const CORNERS = {
        tl:{x:M,       y:M,      inward:Math.PI/4},          // face toward center (down-right)
        tr:{x:W-M,     y:M,      inward:Math.PI*3/4},
        br:{x:W-M,     y:H-M,    inward:Math.PI*5/4},
        bl:{x:M,       y:H-M,    inward:Math.PI*7/4},
      };
      const cn = CORNERS[s.corner];
      const sx = cn.x, sy = cn.y;
      // sweeping watch beam — pointed INWARD toward the fleet
      const sweep = cn.inward + Math.sin(t*0.5)*0.30;
      x.save(); x.translate(sx,sy);
      const beam=x.createRadialGradient(0,0,2,0,0,90);
      beam.addColorStop(0,'rgba(120,190,255,.40)'); beam.addColorStop(1,'transparent');
      x.fillStyle=beam; x.beginPath();
      x.moveTo(0,0); x.arc(0,0,90,sweep-0.32,sweep+0.32); x.closePath(); x.fill();
      // buoy
      x.shadowColor='#7ec8ff'; x.shadowBlur=20;
      x.fillStyle='#57b6ff'; x.beginPath(); x.arc(0,0,5.5+Math.sin(t*2)*1,0,7); x.fill();
      x.shadowBlur=0;
      // label — positioned so it stays on-screen (below for top corners, above for bottom)
      x.fillStyle='#9adcff'; x.font='bold 15px ui-monospace';
      x.textAlign = (s.corner==='tl'||s.corner==='bl') ? 'left' : 'right';
      const lx = (s.corner==='tl'||s.corner==='bl') ? 10 : -10;
      const ly = (s.corner==='tl'||s.corner==='tr') ? 22 : -14;
      x.fillText(s.n, lx, ly);
      x.restore();
    });

    // ---- offshore cloud vessels (dashed, dim gold, drifting) ----
    offshore.forEach((o,i)=>{
      const px=CX+o.gx*U, py=CY+o.gy*U*0.72 + Math.sin(t*0.4+i)*3;
      x.save(); x.translate(px,py);
      // faint supply tether to fleet
      x.strokeStyle='rgba(95,220,140,.10)'; x.lineWidth=1;
      x.beginPath(); x.moveTo(0,0); x.lineTo((CX-px)*0.4,(CY-py)*0.4); x.stroke();

      // ---- emanating WHITE ping (expanding ring, loops) ----
      const ping = (t*0.6 + i*0.5) % 1;              // 0..1
      x.beginPath(); x.arc(0,0, 8 + ping*26, 0, 7);
      x.strokeStyle = 'rgba(255,255,255,'+(0.5*(1-ping))+')';   // fades as it expands
      x.lineWidth = 2; x.stroke();
      // a second, offset ping for a steady broadcast feel
      const ping2 = (t*0.6 + i*0.5 + 0.5) % 1;
      x.beginPath(); x.arc(0,0, 8 + ping2*26, 0, 7);
      x.strokeStyle = 'rgba(255,255,255,'+(0.35*(1-ping2))+')';
      x.lineWidth = 1.5; x.stroke();

      // ---- GREEN satellite body ----
      // solar panels (two wings)
      x.fillStyle = 'rgba(60,180,110,.9)';
      x.strokeStyle = 'rgba(120,255,180,.9)'; x.lineWidth = 1.5;
      x.fillRect(-22,-5, 12, 10); x.strokeRect(-22,-5, 12, 10);   // left panel
      x.fillRect( 10,-5, 12, 10); x.strokeRect( 10,-5, 12, 10);   // right panel
      // panel grid lines
      x.strokeStyle='rgba(20,80,50,.6)'; x.lineWidth=0.8;
      for(const bx of [-19,-16,-13, 13,16,19]){ x.beginPath(); x.moveTo(bx,-5); x.lineTo(bx,5); x.stroke(); }
      // central bus (body)
      x.fillStyle = 'rgba(70,220,130,1)';
      x.strokeStyle = '#eafff2'; x.lineWidth = 1.5;
      x.beginPath(); x.roundRect(-9,-7, 18, 14, 3); x.fill(); x.stroke();
      // bright core glow
      x.shadowColor='#7dffb0'; x.shadowBlur=12;
      x.fillStyle='#c9ffe0'; x.beginPath(); x.arc(0,0,3.5,0,7); x.fill();
      x.shadowBlur=0;
      // little dish antenna on top
      x.strokeStyle='rgba(200,255,220,.9)'; x.lineWidth=1.4;
      x.beginPath(); x.moveTo(0,-7); x.lineTo(0,-13); x.stroke();
      x.beginPath(); x.arc(0,-14,3,0,Math.PI,true); x.stroke();

      // label — offset INWARD (toward fleet center) so it never collides with the sentry ring labels outside
      x.fillStyle='rgba(150,255,190,.95)'; x.font='bold 15px ui-monospace'; x.textAlign='center';
      const inwardX = (px < CX) ? 26 : (px > CX ? -26 : 0);   // pull toward center horizontally
      const inwardY = (py < CY) ? 26 : -26;                    // and vertically toward center
      x.fillText(o.n, inwardX, inwardY);
      x.restore();
    });

    // ---- the ships of the line (gold, bobbing) ----
    ships.forEach((s,i)=>{
      const bob = Math.sin(t*0.8 + i)*3;
      const px = CX + s.gx*U, py = CY + s.gy*U*0.72 + bob;
      const heading = -Math.PI/2 + Math.sin(t*0.3+i)*0.06; // gently pointing "up"/forward
      const col = s.cls==='flag' ? '#f5d76e' : '#caa23a';
      const glow= s.cls==='flag' ? 'rgba(245,215,110,.7)' : 'rgba(202,162,58,.4)';
      ship(px,py,s.size,heading,col,glow,s.cls==='flag');
      x.fillStyle= s.cls==='flag' ? '#ffe6a0':'#e6c878';
      x.font=(s.cls==='flag'?'bold 17px ':'bold 15px ')+'ui-monospace'; x.textAlign='center';
      x.fillText(s.n, px, py+24*s.size);
    });

    // center label
    x.fillStyle='rgba(138,149,173,.5)'; x.font='13px ui-monospace'; x.textAlign='center';
    x.fillText('AMENTI · at anchor', CX, CY+2);

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
